name: BR prison walk

on:
  push:
    branches: [perf/br-snapshot-pool]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: edsuuu/VI-BR-PORT
          ref: 94e5841537daed4596fa7126cbda714fe550925b
          path: br
          persist-credentials: false
      - name: Apply cache checkpoint patch
        run: git -C br apply --check ../patches/br-cache-checkpoint.patch
      - run: git -C br apply ../patches/br-cache-checkpoint.patch
      - name: Apply contiguous descriptor reads
        run: git -C br apply ../patches/br-descriptor-reads.patch
      - name: Benchmark descriptor comparison on identical buffers
        shell: pwsh
        working-directory: br
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'crates/victory-gpu/src/descriptor/host.rs'
          function Read-Kernel {
            $s = [IO.File]::ReadAllText((Resolve-Path $path))
            $i = $s.IndexOf('fn changed_records(')
            $j = $s.IndexOf('#[cfg(test)]', $i)
            return $s.Substring($i, $j - $i)
          }
          $original = (Read-Kernel).Replace('fn changed_records(', 'fn reference(')
          git apply --recount ../patches/br-fixed-stride.patch
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $candidate = Read-Kernel
          $bench = Get-Content ../scripts/stride-bench.rs -Raw
          Set-Content $env:RUNNER_TEMP/stride.rs -Value ($original + $candidate + $bench) -Encoding utf8NoBOM
          rustc --edition=2024 -O $env:RUNNER_TEMP/stride.rs -o $env:RUNNER_TEMP/stride.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & "$env:RUNNER_TEMP/stride.exe" | Tee-Object -FilePath ../stride-results.txt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Apply and test snapshot buffer reuse
        shell: pwsh
        working-directory: br
        run: |
          git apply ../patches/br-snapshot-pool.patch
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $source = Get-Content crates/victory-gpu/src/shadow.rs -Raw
          $start = $source.IndexOf('static POOL:')
          $end = $source.IndexOf('const NOT_WATCHED:', $start)
          $pool = $source.Substring($start, $end - $start)
          $test = @'
          fn main() {
              let mut expected: Vec<usize> = Vec::new();
              let mut seed = 123456u32;
              for step in 0..100_000 {
                  seed = seed.wrapping_mul(1664525).wrapping_add(1013904223);
                  let n = (seed >> 16) as usize % 4096;
                  if step % 5 < 3 {
                      let v = Vec::with_capacity(n);
                      expected.push(v.capacity());
                      expected.sort_unstable_by(|a,b| b.cmp(a));
                      expected.truncate(snapshots_kept());
                      give_back(v);
                  } else {
                      let fit = expected.iter().rposition(|&cap| cap >= n && cap <= (4*n).max(1<<20));
                      let want = fit.map(|i| expected.remove(i)).unwrap_or(n);
                      let got = pooled(n);
                      assert_eq!(got.len(), 0);
                      assert_eq!(got.capacity(), want);
                  }
                  let pool = POOL.lock().unwrap();
                  assert!(pool.iter().map(Vec::capacity).eq(expected.iter().copied()));
              }
          }
          '@
          $src = Join-Path $env:RUNNER_TEMP 'snapshot_pool.rs'
          $exe = Join-Path $env:RUNNER_TEMP 'snapshot_pool.exe'
          Set-Content $src ("use std::sync::Mutex;" + [Environment]::NewLine + $pool + $test) -Encoding utf8NoBOM
          rustc --edition=2024 -O $src -o $exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:VICTORY_SNAPSHOT_POOL = '64'
          & $exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Check grouped reads against page-by-page results
        working-directory: br
        run: |
          rustc --edition=2024 --test crates/victory-gpu/src/descriptor/page_reads.rs -o page-tests.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ./page-tests.exe
      - name: Enable SDK exports in the BR executable
        shell: pwsh
        run: |
          Copy-Item apps/victory/src/agility.rs br/apps/victory/src/agility.rs
          $src = Get-Content apps/victory/build.rs -Raw
          $src.Replace('cfg!(feature = "agility")', 'true') | Set-Content br/apps/victory/build.rs
          Add-Content br/apps/victory/src/main.rs ''
          Add-Content br/apps/victory/src/main.rs '#[cfg(windows)] mod agility;'
      - run: rustup toolchain install
        working-directory: br
      - name: Verify cached city texture footprints
        working-directory: br
        run: |
          git apply ../patches/br-city-footprints.patch
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --release --locked -p victory-gpu --lib cached_city_footprints_match_layout -- --nocapture
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Verify texture staging under memory pressure
        working-directory: br
        run: |
          git apply ../patches/br-trim-staging.patch
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cargo test --release --locked -p victory-gpu --lib staging_trim_tests -- --nocapture
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build diagnostic executable
        working-directory: br
        run: cargo build --release -p victory --locked
      - name: Stage Microsoft D3D12 runtime
        shell: pwsh
        run: |
          $version = '1.620.2'
          $package = "microsoft.direct3d.d3d12.$version.nupkg"
          $baseUrl = "https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.d3d12/$version"
          $zip = Join-Path $env:RUNNER_TEMP 'd3d12-sdk.zip'
          Invoke-WebRequest -Uri "$baseUrl/$package" -OutFile $zip
          $expected = 'd683ff7f5726906c3f43d299f6cdd4b1cad22f8329ccd27b3492d0a1413d9904102b8d543419bec3b3545c86bf49f6a500ebf42d95c999aa0969e5d693032735'
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA512).Hash.ToLowerInvariant()
          if ($actual -cne $expected) { throw 'NuGet package SHA-512 mismatch' }
          $unpacked = Join-Path $env:RUNNER_TEMP 'd3d12-sdk'
          Expand-Archive -LiteralPath $zip -DestinationPath $unpacked
          $destination = 'br/target/release/D3D12'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          foreach ($name in @('D3D12Core.dll', 'd3d12SDKLayers.dll')) {
            $dll = Join-Path $unpacked "build/native/bin/x64/$name"
            $signature = Get-AuthenticodeSignature -LiteralPath $dll
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
              throw "$name does not have a valid Microsoft signature"
            }
            Copy-Item -LiteralPath $dll -Destination (Join-Path $destination $name)
          }
      - name: Verify diagnostic executable exports
        shell: pwsh
        run: |
          $report = & br/target/release/victory.exe inspect br/target/release/victory.exe --exports | Out-String
          if ($LASTEXITCODE -ne 0 -or $report -notmatch 'D3D12SDKVersion' -or $report -notmatch 'D3D12SDKPath') {
            throw 'The diagnostic executable does not export the Agility SDK settings'
          }
      - name: Verify and stage launcher
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/Run-Walk.ps1).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
          Copy-Item scripts/Run-Walk.ps1 br/target/release/
          & br/target/release/victory.exe run --help
      - uses: actions/upload-artifact@v4
        with:
          name: victory-br-staging
          path: |
            Start-Game.cmd
            stride-results.txt
            br/target/release/Run-Walk.ps1
            br/target/release/victory.exe
            br/target/release/D3D12/D3D12Core.dll
            br/target/release/D3D12/d3d12SDKLayers.dll
          if-no-files-found: error

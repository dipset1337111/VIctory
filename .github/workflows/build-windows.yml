name: Build VIctory for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - name: Build diagnostic executable
        run: cargo build --profile diag -p victory --features diagnostics --locked
      - name: Upload diagnostic executable
        uses: actions/upload-artifact@v4
        with:
          name: victory-windows-diag
          path: target/diag/victory.exe
          if-no-files-found: error
      - name: Run workspace tests
        run: cargo test --workspace --locked

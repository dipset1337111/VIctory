name: Build VIctory with AVX2 snapshot copies

on:
  push:
    branches: [diagnostics/ada-stream-copy]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the pinned diagnostic source
        shell: pwsh
        env:
          SOURCE_SHA: 06702fe86b91bacbf4a0a27662ae443435bf732e
        run: |
          $source = $env:SOURCE_SHA
          $agility = 'e8af2d3ec82b5e882cff75c4242b6906c186b560'
          git fetch --no-tags https://github.com/fxceless/victory-fork.git $source
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the pinned source' }
          git switch --detach $source
          if ($LASTEXITCODE -ne 0) { throw 'Could not switch to the pinned source' }
          if ((git rev-parse HEAD) -cne $source) { throw 'Unexpected world-rendering source' }
          git restore --source=$agility -- apps/victory/build.rs apps/victory/src/agility.rs
          if ($LASTEXITCODE -ne 0) { throw 'Could not copy the pinned Agility exports' }
          $manifest = (Resolve-Path 'apps/victory/Cargo.toml').Path
          $manifestText = [IO.File]::ReadAllText($manifest)
          $features = '(?m)^\[features\]\r?\n'
          if ([regex]::Matches($manifestText, $features).Count -ne 1) { throw 'Unexpected Cargo feature section' }
          [IO.File]::WriteAllText($manifest, [regex]::Replace($manifestText, $features, { param($match) $match.Value + "agility = []`n" }))
          $main = (Resolve-Path 'apps/victory/src/main.rs').Path
          $mainText = [IO.File]::ReadAllText($main)
          $modules = '(?m)^mod census;'
          if ([regex]::Matches($mainText, $modules).Count -ne 1) { throw 'Unexpected app module declarations' }
          $agilityModule = @'
          #[cfg(all(windows, target_env = "msvc", feature = "agility"))]
          mod agility;

          '@
          [IO.File]::WriteAllText($main, [regex]::Replace($mainText, $modules, ($agilityModule + "`nmod census;")))
          git status --short
      - name: Apply the AVX2 snapshot copy from Joly0's PR 98
        shell: pwsh
        run: |
          # Adapted from 4688ba05619790c3e20cbab7f259acb4aa20df8c (GPL-3.0-or-later).
          $patch = Join-Path $env:RUNNER_TEMP 'victory-avx2-snapshot.patch'
          $diff = @'
          diff --git a/crates/victory-gpu/src/shadow.rs b/crates/victory-gpu/src/shadow.rs
          --- a/crates/victory-gpu/src/shadow.rs
          +++ b/crates/victory-gpu/src/shadow.rs
          @@ -1479,1 +1479,83 @@
          -/// Copies `len` bytes, on several threads if they are many: a snapshot of
          +/// Copies `len` bytes whose destination the CPU does not read again soon (a
          +/// snapshot, compared only after the card ran), with streaming stores if
          +/// they are many (`VICTORY_STREAM_COPY=1`).
          +///
          +/// An ordinary copy reads each line of the destination before it writes
          +/// it. On an i9-12900K with two DDR5-5200 modules writes are what is
          +/// scarce: 512 MB copied 14.5 GB/s on one thread and no more on sixteen,
          +/// written alone 23 GB/s, copied with streaming stores 24 GB/s (reads 37
          +/// GB/s on one thread, 55 on several).
          +///
          +/// # Safety
          +/// Both ranges are valid for `len` bytes and do not overlap.
          +pub(crate) unsafe fn copy_streaming(src: *const u8, dst: *mut u8, len: usize) {
          +    // Below this a plain copy: the head and tail cost as much, and small
          +    // destinations may well be in the cache already.
          +    const FEW: usize = 4096;
          +    #[cfg(target_arch = "x86_64")]
          +    if len >= FEW && streaming_copy_enabled() {
          +        // SAFETY: the caller's; AVX2 is there (`streaming_copy_enabled`).
          +        unsafe { stream_avx2(src, dst, len) };
          +        return;
          +    }
          +    // SAFETY: the caller's.
          +    unsafe { std::ptr::copy_nonoverlapping(src, dst, len) };
          +}
          +
          +/// Whether [`copy_streaming`] streams.
          +fn streaming_copy_enabled() -> bool {
          +    static ON: std::sync::OnceLock<bool> = std::sync::OnceLock::new();
          +    *ON.get_or_init(|| avx2() && std::env::var_os("VICTORY_STREAM_COPY").is_some_and(|v| v == "1"))
          +}
          +
          +fn avx2() -> bool {
          +    #[cfg(target_arch = "x86_64")]
          +    {
          +        std::is_x86_feature_detected!("avx2")
          +    }
          +    #[cfg(not(target_arch = "x86_64"))]
          +    {
          +        false
          +    }
          +}
          +
          +/// The head up to a 32-byte boundary of `dst` and the tail plainly, the rest
          +/// in 32-byte streaming stores, four at a time; fenced, so that whoever is
          +/// told the copy is done sees the bytes.
          +///
          +/// # Safety
          +/// As [`copy_streaming`]; the CPU has AVX2.
          +#[cfg(target_arch = "x86_64")]
          +#[target_feature(enable = "avx2")]
          +unsafe fn stream_avx2(src: *const u8, dst: *mut u8, len: usize) {
          +    use std::arch::x86_64::{__m256i, _mm_sfence, _mm256_loadu_si256, _mm256_stream_si256};
          +    let head = (dst as usize).wrapping_neg() & 31;
          +    // SAFETY: the caller's ranges throughout; `head < 32 <= len`, and the
          +    // streamed part is whole 32-byte blocks inside them, `dst` aligned.
          +    unsafe {
          +        std::ptr::copy_nonoverlapping(src, dst, head);
          +        let (s, d) = (src.add(head), dst.add(head));
          +        let blocks = (len - head) / 32;
          +        let mut i = 0;
          +        while i + 4 <= blocks {
          +            let a = _mm256_loadu_si256(s.add(i * 32).cast::<__m256i>());
          +            let b = _mm256_loadu_si256(s.add(i * 32 + 32).cast::<__m256i>());
          +            let c = _mm256_loadu_si256(s.add(i * 32 + 64).cast::<__m256i>());
          +            let e = _mm256_loadu_si256(s.add(i * 32 + 96).cast::<__m256i>());
          +            _mm256_stream_si256(d.add(i * 32).cast::<__m256i>(), a);
          +            _mm256_stream_si256(d.add(i * 32 + 32).cast::<__m256i>(), b);
          +            _mm256_stream_si256(d.add(i * 32 + 64).cast::<__m256i>(), c);
          +            _mm256_stream_si256(d.add(i * 32 + 96).cast::<__m256i>(), e);
          +            i += 4;
          +        }
          +        while i < blocks {
          +            _mm256_stream_si256(d.add(i * 32).cast::<__m256i>(), _mm256_loadu_si256(s.add(i * 32).cast::<__m256i>()));
          +            i += 1;
          +        }
          +        let done = head + blocks * 32;
          +        std::ptr::copy_nonoverlapping(src.add(done), dst.add(done), len - done);
          +        _mm_sfence();
          +    }
          +}
          +
          +/// Copies `len` bytes, on several threads if they are many: a snapshot of
          @@ -1487,7 +1569,7 @@
          -    let threads = (len / PER_THREAD).clamp(1, 6);
          -    if threads == 1 {
          -        // SAFETY: the caller's.
          -        unsafe { std::ptr::copy_nonoverlapping(src, dst, len) };
          -        return;
          -    }
          -    let (src, dst, each) = (src as usize, dst as usize, len.div_ceil(threads));
          +    let threads = (len / PER_THREAD).clamp(1, 6);
          +    if threads == 1 {
          +        // SAFETY: the caller's.
          +        unsafe { copy_streaming(src, dst, len) };
          +        return;
          +    }
          +    let (src, dst, each) = (src as usize, dst as usize, len.div_ceil(threads));
          @@ -1497,7 +1579,7 @@
          -            let n = each.min(len - at);
          -            s.spawn(move || {
          -                // SAFETY: a part of the caller's ranges.
          -                unsafe { std::ptr::copy_nonoverlapping((src + at) as *const u8, (dst + at) as *mut u8, n) };
          -            });
          -        }
          -    });
          +            let n = each.min(len - at);
          +            s.spawn(move || {
          +                // SAFETY: a part of the caller's ranges.
          +                unsafe { copy_streaming((src + at) as *const u8, (dst + at) as *mut u8, n) };
          +            });
          +        }
          +    });
          @@ -1645,7 +1727,7 @@
          -                for (src, dst, len) in group {
          -                    // SAFETY: the caller's ranges: a host copy's mapping and
          -                    // its snapshot, which do not overlap.
          -                    unsafe { std::ptr::copy_nonoverlapping(src as *const u8, dst as *mut u8, len) };
          -                }
          -            }));
          -        }
          +                for (src, dst, len) in group {
          +                    // SAFETY: the caller's ranges: a host copy's mapping and
          +                    // its snapshot, which do not overlap.
          +                    unsafe { copy_streaming(src as *const u8, dst as *mut u8, len) };
          +                }
          +            }));
          +        }
          @@ -1843,6 +1925,27 @@
          -        assert!(src == dst);
          -    }
          -
          -    /// The pieces found on several threads are the ones a walk piece by
          -    /// piece finds, for copies that start anywhere in a 64 KiB piece of
          -    /// title memory and ranges that start and end anywhere.
          +        assert!(src == dst);
          +    }
          +
          +    /// A streaming copy puts every byte of the range and none beside it,
          +    /// whatever the alignment of either side and the length (under the
          +    /// plain copy's threshold, at it, a few blocks more, an odd tail).
          +    #[test]
          +    fn a_streaming_copy_copies_the_range_and_nothing_beside() {
          +        let src: Vec<u8> = (0..300_000usize).map(|i| (i * 131 + i / 251) as u8).collect();
          +        for len in [0usize, 1, 31, 4095, 4096, 4097, 4096 + 127, 70_001, 200_000] {
          +            for src_at in [0usize, 1, 7, 32, 45] {
          +                for dst_at in [0usize, 1, 13, 31, 32, 64 + 5] {
          +                    let mut dst = vec![0xA5u8; len + dst_at + 100];
          +                    // SAFETY: both inside their vectors, apart.
          +                    unsafe { super::copy_streaming(src.as_ptr().add(src_at), dst.as_mut_ptr().add(dst_at), len) };
          +                    let at = (len, src_at, dst_at);
          +                    assert!(dst[..dst_at].iter().all(|&b| b == 0xA5), "before {at:?}");
          +                    assert!(dst[dst_at..dst_at + len] == src[src_at..src_at + len], "inside {at:?}");
          +                    assert!(dst[dst_at + len..].iter().all(|&b| b == 0xA5), "after {at:?}");
          +                }
          +            }
          +        }
          +    }
          +
          +    /// The pieces found on several threads are the ones a walk piece by
          +    /// piece finds, for copies that start anywhere in a 64 KiB piece of
          +    /// title memory and ranges that start and end anywhere.
          @@ -2968,7 +3071,7 @@
          -                    let (lo, hi) = (lo.max(from), hi.min(to));
          -                    // SAFETY: as below; `hi <= total`.
          -                    unsafe {
          -                        std::ptr::copy_nonoverlapping(self.data.add(lo), snapshot.as_mut_ptr().add(lo), hi - lo);
          -                    }
          -                    kept.0[piece] = whole;
          -                }
          +                    let (lo, hi) = (lo.max(from), hi.min(to));
          +                    // SAFETY: as below; `hi <= total`.
          +                    unsafe {
          +                        copy_streaming(self.data.add(lo), snapshot.as_mut_ptr().add(lo), hi - lo);
          +                    }
          +                    kept.0[piece] = whole;
          +                }
          '@
          [IO.File]::WriteAllText($patch, $diff.Replace("`r`n", "`n") + "`n")
          git apply --ignore-space-change --unidiff-zero $patch
          if ($LASTEXITCODE -ne 0) { throw 'Snapshot copy patch did not apply' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Snapshot copy patch did not apply cleanly' }
      - run: rustup toolchain install
      - name: Test streaming copies for size and alignment
        env:
          VICTORY_STREAM_COPY: '1'
        run: cargo test --profile diag -p victory-gpu --features diagnostics --locked a_streaming_copy_copies_the_range_and_nothing_beside
      - name: Build diagnostic executable
        run: cargo build --profile diag -p victory --features diagnostics,agility --locked
      - name: Stage Microsoft D3D12 runtime
        shell: pwsh
        run: |
          $version = '1.620.2'
          $package = "microsoft.direct3d.d3d12.$version.nupkg"
          $baseUrl = "https://api.nuget.org/v3-flatcontainer/microsoft.direct3d.d3d12/$version"
          $zip = Join-Path $env:RUNNER_TEMP 'd3d12-sdk.zip'
          Invoke-WebRequest -Uri "$baseUrl/$package" -OutFile $zip
          $expected = 'd683ff7f5726906c3f43d299f6cdd4b1cad22f8329ccd27b3492d0a1413d9904102b8d543419bec3b3545c86bf49f6a500ebf42d95c999aa0969e5d693032735'
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA512).Hash.ToLowerInvariant()
          if ($actual -cne $expected) { throw 'NuGet package SHA-512 mismatch' }
          $unpacked = Join-Path $env:RUNNER_TEMP 'd3d12-sdk'
          Expand-Archive -LiteralPath $zip -DestinationPath $unpacked
          $destination = 'target/diag/D3D12'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null
          foreach ($name in @('D3D12Core.dll', 'd3d12SDKLayers.dll')) {
            $dll = Join-Path $unpacked "build/native/bin/x64/$name"
            $signature = Get-AuthenticodeSignature -LiteralPath $dll
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
              throw "$name does not have a valid Microsoft signature"
            }
            Copy-Item -LiteralPath $dll -Destination (Join-Path $destination $name)
          }
      - name: Verify diagnostic executable exports
        shell: pwsh
        run: |
          $report = & target/diag/victory.exe inspect target/diag/victory.exe --exports | Out-String
          if ($LASTEXITCODE -ne 0 -or $report -notmatch 'D3D12SDKVersion' -or $report -notmatch 'D3D12SDKPath') {
            throw 'The diagnostic executable does not export the Agility SDK settings'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: victory-windows-agility-ada-stream-copy-diag
          path: |
            target/diag/victory.exe
            target/diag/D3D12/D3D12Core.dll
            target/diag/D3D12/d3d12SDKLayers.dll
          if-no-files-found: error
